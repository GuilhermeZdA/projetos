<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <main id="main">
        <div id="imagem"></div>
        <div id="container">
            <div id="opc">
                <input type="button" value="Funcionário" id="funcionario" onclick="fun()">
                <input type="button" value="Paciente" id="hospital" onclick="hos()">
            </div>
        
            <div id="box-input">
                <div id="login">
                    <label for="ilogin" class="label">Login: </label>
                    <input type="text" id="ilogin">
                </div>
                <div id="senha">
                    <label for="isenha" class="label" id="senha-label">Senha:</label>
                    <input type="password" id="isenha">
                    <a id="entrar" href="funcionario.html" target="_parent">Entrar</a>
                </div>
            </div>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
